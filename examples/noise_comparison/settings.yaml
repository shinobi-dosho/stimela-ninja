# Fixed tool arguments. The recipe sets the MS, column, weighting, channel
# selection, image size, threads and output paths for each job.
simms:
  dfreq: 16MHz
  correlations: XX,YY
wsclean:
  niter: 0
  make_psf: true
  nchan: 1
ddfacet:
  output_mode: DirtyPSF
  output_images: dP
  data_chunk_hours: 0.08333333333333333  # five minutes
  weight_mode: Briggs
  freq_n_band: 1
  facets_n_facets: 1
  cache_psf: "off"
  cache_vis_data: "off"
  cache_dirty: "off"
  cache_last_residual: false
  cache_cf: false
  cache_hmp: false
casa:  # tclean keywords
  stokes: I
  specmode: mfs
  gridder: standard
  npixels: 0
  uvtaper: []
  niter: 0
  interactive: false
  savemodel: none
  restart: false
  calcpsf: true
  calcres: true
  restoration: false
  pbcor: false
  parallel: false
