name: Cab candidate pair
on:
  workflow_dispatch:
    inputs:
      dosho-ref:
        description: Exact compatible Dosho candidate ref
        required: true
        type: string
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: shinobi-dosho/dosho
          ref: ${{ inputs.dosho-ref }}
          path: .work-cache/dosho-candidate
      - name: Install locked dependencies and explicit wheel pair
        run: |
          uv sync --locked --python 3.12 --group dev --group examples --extra fits
          bash .github/scripts/install-candidate-pair.sh .work-cache/dosho-candidate
      - name: Verify candidate contracts
        run: |
          uv run --no-sync pytest -q -o pythonpath= tests/test_dosho_boundary.py tests/test_dosho_compat.py tests/test_neutral_adaptation.py tests/test_yaml_cab_loader.py tests/test_policies.py tests/test_offload_bundle.py tests/test_offload_worker.py
          uv run --no-sync pytest -q -o pythonpath= .work-cache/dosho-candidate/tests
