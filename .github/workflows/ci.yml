name: CI

on:
  workflow_dispatch:
    inputs:
      dosho-ref:
        description: Compatible Dosho source ref (use an exact candidate SHA before merge)
        type: string
        default: main
  workflow_call:
    inputs:
      dosho-ref:
        type: string
        default: main
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout explicit Dosho candidate
        uses: actions/checkout@v7
        with:
          repository: shinobi-dosho/dosho
          ref: ${{ inputs.dosho-ref || 'main' }}
          path: .work-cache/dosho-candidate

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Ordinary jobs use --locked: install versions committed in uv.lock and fail
      # if the lock does not match pyproject.toml. Without it, a green run only
      # means the tree passed against whatever PyPI happened to publish that
      # morning -- a red one tomorrow could be this repo's fault or a
      # dependency's, and the log cannot tell you which.

      # Lint the whole tree, not just `src tests`. Scoping it there meant
      # `ruff check .` failed locally on a green commit -- docs/conf.py and
      # examples/ were never checked, so nobody could trust the bare command.
      # The formatter is checked for the same reason: it was never enforced,
      # and two files had quietly drifted out of formatted shape.
      - name: Install locked dependencies and candidate wheels
        run: |
          uv sync --python ${{ matrix.python-version }} --locked --group dev
          bash .github/scripts/install-candidate-pair.sh .work-cache/dosho-candidate

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest -q -o pythonpath=

  docs:
    if: github.event_name != 'schedule'
    name: Strict documentation build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout explicit Dosho candidate
        uses: actions/checkout@v7
        with:
          repository: shinobi-dosho/dosho
          ref: ${{ inputs.dosho-ref || 'main' }}
          path: .work-cache/dosho-candidate

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # Source CI tests explicit candidate wheels. Release docs keep the
      # published dependency gate and do not use this overlay.
      - name: Install locked documentation dependencies and candidate wheels
        run: |
          uv sync --python 3.12 --locked --group docs
          bash .github/scripts/install-candidate-pair.sh .work-cache/dosho-candidate

      - name: Build documentation
        run: uv run --no-sync sphinx-build -E -n -W --keep-going -b html docs docs/_build/html

  casacore:
    name: Measurement Set integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout explicit Dosho candidate
        uses: actions/checkout@v7
        with:
          repository: shinobi-dosho/dosho
          ref: ${{ inputs.dosho-ref || 'main' }}
          path: .work-cache/dosho-candidate

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Refresh to the latest msutils release on every integration run,
      # including the daily scheduled check.
      - name: Resolve latest msutils release
        run: uv lock --upgrade-package msutils

      - name: Install all locked inspectors and candidate wheels
        run: |
          uv sync --python ${{ matrix.python-version }} --locked --group dev --group measurement-set --extra fits-contract
          bash .github/scripts/install-candidate-pair.sh .work-cache/dosho-candidate

      - name: Verify optional inspector installation
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata as metadata

          print({"msutils": metadata.version("msutils")}, flush=True)

          import casacore.tables, xarray_ms, zarr, msutils
          from shinobi._state_adapter import runtime
          print(runtime())
          PY

      # Run each module containing a casacore-gated test, rather than naming
      # one fixture test and leaving the closure/access cases silently skipped
      # in the ordinary matrix.
      - name: Run real CASA-table model, closure, and access tests
        run: uv run --no-sync pytest -q -o pythonpath= tests/test_datasets.py tests/test_dataset_closure.py tests/test_dataset_access.py

      # The mutation lifecycle's observations, signatures and rollbacks are
      # only meaningful against real tables; the main job skips this file.
      - name: Run strict MSv2 lifecycle tests against real tables
        run: uv run --no-sync pytest -q -o pythonpath= tests/test_dataset_mutation.py tests/test_dataset_lifecycle.py::test_real_casacore_contained_read_when_available tests/test_strict_read_products.py tests/test_dataset_lists.py tests/test_dataset_list_writes.py tests/test_offload_dataset_lifecycle.py tests/test_contained_products.py tests/test_yaml_datasets.py tests/test_derived_mutations_live.py tests/test_derived_restart_live.py

      # FITS is optional in the ordinary matrix. Qualify its real scanner,
      # lifecycle and MS product gates here with both optional stacks present.
      - name: Verify optional FITS installation
        run: uv run --no-sync python -c "import astropy.io.fits, astropy.wcs, numpy; print(astropy.__version__)"

      - name: Run FITS structure, lifecycle, and product tests
        run: uv run --no-sync pytest -q -o pythonpath= tests/test_fits.py tests/test_fits_lifecycle.py tests/test_fits_products.py

      - name: Run real state export, materialization and process-death recovery
        run: uv run --no-sync pytest -q -o pythonpath= tests/test_dataset_state.py tests/test_dataset_state_live.py tests/test_state_precision.py tests/test_state_metadata.py tests/test_state_qualification.py tests/test_state_replay_structure.py

  audit:
    if: github.event_name != 'schedule'
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Runtime dependencies only, straight off uv.lock (--frozen), so the
      # versions audited here are the versions the test jobs installed and the
      # versions in the diff under review. The exported file is echoed to the
      # log, which is the record of what was actually checked.
      #
      # Same two commands as `.githooks/pre-commit`, so a clean commit and a
      # green job mean the same thing.
      - name: Export locked dependencies
        run: |
          uv export --frozen --no-emit-project --no-default-groups --no-hashes \
            --group measurement-set \
            --format requirements-txt -o requirements-audit.txt

      - name: pip-audit
        run: uv run --locked --group audit pip-audit --no-deps --requirement requirements-audit.txt
