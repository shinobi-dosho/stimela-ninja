name: dosho compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 22 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Candidate source (main) or hard-failing released compatibility gate
        type: choice
        options: [main, released]
        default: main
      dosho-ref:
        description: Explicit Dosho source ref for the main lane
        type: string
        default: main
  workflow_call:
    inputs:
      lane:
        type: string
        required: true
      dosho-ref:
        type: string
        default: main

permissions:
  contents: read

jobs:
  compatibility:
    name: dosho ${{ matrix.lane == 'main' && 'candidate source' || 'released publication gate' }} (Python 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.lane && format('["{0}"]', inputs.lane) || '["main"]') }}
    steps:
      - name: Checkout shinobi
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Test installed dosho against this checkout
        env:
          DOSHO_LANE: ${{ matrix.lane }}
          DOSHO_REF: ${{ inputs.dosho-ref || 'main' }}
        run: bash .github/scripts/test-dosho-compat.sh "$DOSHO_LANE" "$DOSHO_REF"
