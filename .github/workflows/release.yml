name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag and citation match package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          citation="$(grep -m1 -E '^version: ' CITATION.cff | sed -E 's/version: "(.*)"/\1/')"
          echo "tag=$tag pyproject=$pkg citation=$citation"
          if [ "$tag" != "$pkg" ] || [ "$citation" != "$pkg" ]; then
            echo "::error::Release versions do not agree"
            exit 1
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Verify locked environment
        run: uv lock --check

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} --locked --group dev ruff check .

      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} --locked --group dev ruff format --check .

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --locked --group dev pytest -q

  docs:
    name: Strict documentation build
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build documentation
        run: uv run --python 3.12 --locked --group docs sphinx-build -E -n -W --keep-going -b html docs docs/_build/html

  publish:
    name: Build and publish to PyPI
    needs: [test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: uvx twine upload --non-interactive dist/*
