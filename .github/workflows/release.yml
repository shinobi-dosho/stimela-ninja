name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag and citation match package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          citation="$(grep -m1 -E '^version: ' CITATION.cff | sed -E 's/version: "(.*)"/\1/')"
          echo "tag=$tag pyproject=$pkg citation=$citation"
          if [ "$tag" != "$pkg" ] || [ "$citation" != "$pkg" ]; then
            echo "::error::Release versions do not agree"
            exit 1
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Verify locked environment
        run: uv lock --check

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} --locked --group dev ruff check .

      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} --locked --group dev ruff format --check .

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --locked --group dev pytest -q

  docs:
    name: Strict documentation build
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build documentation
        run: uv run --python 3.12 --locked --group docs sphinx-build -E -n -W --keep-going -b html docs docs/_build/html

  dosho-compatibility:
    name: Verify released dosho compatibility
    needs: preflight
    uses: ./.github/workflows/dosho-compat.yml
    with:
      lane: released

  build:
    name: Build distribution
    needs: [test, docs, dosho-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  distribution-smoke:
    name: Install wheel with released dosho
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for locked dosho version
        uses: actions/checkout@v7

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install wheel and exercise dosho provider
        run: |
          dosho_version=$(python3 - <<'PY'
          import tomllib

          with open("uv.lock", "rb") as stream:
              packages = tomllib.load(stream)["package"]
          print(next(package["version"] for package in packages if package["name"] == "dosho"))
          PY
          )
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl "dosho==$dosho_version"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PY'
          import sys
          from pathlib import Path

          import dosho
          import shinobi
          from shinobi import cabs

          assert Path(shinobi.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert "wsclean" in dosho.list_cabs()
          assert cabs.get("wsclean").name == "wsclean"
          print(f"wheel: {shinobi.__file__}; dosho: {dosho.__file__}")
          PY
          "$RUNNER_TEMP/wheel-smoke/bin/ninja" cabs list > "$RUNNER_TEMP/ninja-cabs.txt"
          grep -q dosho "$RUNNER_TEMP/ninja-cabs.txt"

  publish:
    name: Publish to PyPI
    needs: [build, distribution-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
