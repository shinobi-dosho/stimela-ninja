[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stimela-ninja"
version = "0.1.0b5"
description = "Stimela 3.0 -- A robust, flexible and simple framework for reproducible radio astronomy pipelines"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sphesihle Makhathini", email = "sphemakh@gmail.com" },
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "packaging>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

# dosho (the native shinobi cab repository) supplies the real
# wsclean/cubical/simms cabs `examples/example-simulation.py` imports.
#
# This was previously impossible to express as a dependency group: dosho
# redirected its own `stimela-ninja` dependency to a git source via
# [tool.uv.sources], which gave uv two different sources for one package name
# once this project was also in the resolution -- and since uv locks all
# dependency-groups together, that broke `uv lock` for everyone rather than
# only for examples users. dosho dropped the redirect once `Scope.scratch`
# shipped in 0.1.0b5 (dosho #42), so a plain group resolves cleanly now.
examples = ["dosho"]

# simms needs no entry here. dosho's `skysim`/`telsim`/`primary_beam` cabs bind
# `image=images.SIMMS` and run as pysteps inside that container, so the `examples`
# group above already covers them. (This used to say simms was a manual install
# with no image and no PyPI release; all three were true of the pre-3.0 binary --
# dosho's `SIMMS_CLASSIC` -- and none are true of simms 3.x, which is on PyPI at
# 3.0.2 and which dosho builds an image from.)
#
# `examples/simms_cli.py` is the exception, and deliberately so: it drives simms
# through vendored cult-cargo-dialect YAML with no image, to exercise the native
# backend. That one needs simms on PATH:
#   uv pip install --no-deps simms

# Documentation build (Sphinx + Furo + autodoc). `uv sync --group docs`.
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
]

# Dependency vulnerability scanning. `.githooks/pre-commit` and the `audit` CI
# job both run `uv run --group audit pip-audit`. Its own group rather than part
# of `dev`: every job in the test matrix installs `dev` and none of them audit,
# so folding it in there buys five extra resolve-and-downloads to serve one job.
# No upper bound -- pip-audit is a client for PyPI's advisory API, and the
# useful version of that is whatever is current.
audit = [
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/shinobi-dosho/stimela-ninja"
Repository = "https://github.com/shinobi-dosho/stimela-ninja"
Documentation = "https://stimela-ninja.readthedocs.io"
Issues = "https://github.com/shinobi-dosho/stimela-ninja/issues"

[project.scripts]
ninja = "shinobi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shinobi"]

[tool.hatch.build.targets.sdist]
# Anchor patterns to the repo root (leading "/"); unanchored names match at
# any depth (gitignore semantics) and would drag in nested README/LICENSE files
# from .opencode/node_modules, examples/, tests/, etc.
include = [
    "/src/shinobi",
    "/README.rst",
    "/LICENSE",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib mode + namespace packages lets test modules use relative imports
# (e.g. `from .fixtures...`) without `tests/` being a package (no __init__.py).
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
line-length = 180

# ruff formats Python embedded in Markdown. The design_*.md files are internal
# scratch (excluded from the docs build too, see docs/conf.py): their snippets
# are illustrative prose, often hand-aligned to make a point, and are not code
# this repo ships. Reformatting them is churn against an argument, not a fix.
exclude = ["docs/design_*.md"]

# Pin the rule set explicitly. Without a `select`, "is this tree lint-clean?"
# is answered by whichever ruff a given machine happens to have installed --
# ruff changes its defaults between releases, so the same commit can be clean
# for one developer and report a hundred violations for another, with no code
# having changed. That makes lint a property of an environment rather than of
# the repo, which is worth exactly nothing as a signal. The list below is a
# decision; extend it deliberately.
#
# Every family here passes on the tree as it stands, so this locks in current
# behaviour rather than declaring a cleanup backlog. It is a strict superset
# of what ruff checked by default before this was pinned (E4/E7/E9 + F).
[tool.ruff.lint]
select = [
    "F",     # pyflakes -- real errors: undefined names, unused imports
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "C4",    # comprehension rewrites
    "DTZ",   # naive datetimes (provenance timestamps must stay tz-aware)
    "ERA",   # commented-out code
    "EXE",   # shebang/executable-bit mismatches
    "FA",    # missing `from __future__ import annotations` -- every module here relies on it
    "FURB",  # modernizations
    "G",     # logging call format (no f-strings in logger.* -- lazy % args)
    "ICN",   # conventional import aliases
    "ISC",   # implicit string concatenation
    "LOG",   # logging misuse
    "PGH",   # blanket `# noqa` / `# type: ignore` without a code
    "Q",     # quote style
    "RSE",   # `raise X()` not `raise X`
    "T10",   # stray debugger imports
    "T20",   # stray `print` (this is a library; output goes through click/logging)
    "TID",   # relative-import hygiene
    "YTT",   # sys.version misuse
]
ignore = [
    # The formatter owns line length. It cannot split long string literals, so
    # E501 only ever fires on lines `ruff format` has already declared final --
    # it would be a permanent 2-violation floor, not a signal.
    "E501",
]

# T20 bans `print` because *the library* must route output through click or
# logging. `examples/` is not the library: those files are standalone scripts
# a user runs directly, and printing the rendered DAG to stdout is the whole
# point of them. The rule stays on everywhere it means something.
[tool.ruff.lint.per-file-ignores]
"examples/*" = ["T20"]

# Families deliberately NOT selected, with the violation count each would add
# today. Each is a real decision to make, not an oversight -- opt one in by
# moving it up and clearing its findings:
#
#   B     9    mostly false positives: 5x B023 where the closure is called
#              inside the same loop iteration, plus B018 in tests where a bare
#              attribute access inside `pytest.raises` is the assertion
#   I     12   import sorting -- all auto-fixable, but a large diff
#   SIM   16   nested `with` merges, mostly in tests
#   UP    46   quoted annotations, `Optional[X]` -> `X | None`
#   RUF   38   incl. unused-`noqa` for rules not selected above
#   PL    235  pylint port; PLW1510 alone is 17 (`subprocess.run` without
#              `check=`, deliberate here -- backends read returncode themselves)
#   ANN   1422 / D 1095 / S 1198  -- annotations, docstring style, bandit;
#              each is a project-wide policy choice, not a cleanup
